<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UIgod · 网点海报动态</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171717;color:#efede8;font:16px system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}p{color:#bbb;line-height:1.6}canvas{display:block;width:100%;height:auto;background:#0b0b0b}section{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:18px}button,input{accent-color:#ff3d1f}button{background:#efede8;border:0;padding:10px 20px;cursor:pointer}input[type=range]{flex:1;min-width:120px}a{color:#ff7056}.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.notes div{padding:14px;border:1px solid #444}code{color:#ff7056}</style>
<main><h1>网点海报动态 · 灰度思维母版</h1><p id="description">可交互风格样本：字号层级、网点成形、单色强调、黑白场切换与语义动作。下方控件不属于成片。</p><canvas id="film" width="1280" height="720"></canvas><section><button id="play">播放</button><input id="seek" type="range" min="0" max="10" value="0" step="0.01" aria-label="时间"><output id="time">0.00s</output><label>强调色 <input id="color" type="color" value="#ff3d1f"></label></section><p id="links"><a href="DESIGN.md">设计规则与提示词</a> · <a href="references/frames/contact-sheet.jpg">原片证据</a> · <a href="examples/index.html">换主题迁移样例</a></p><div class="notes"><div>保持：巨型黑体 / 高反差 / 网点主体</div><div>可改：主题 / 主体 / 单一强调色</div><div>默认删除：HUD / 标尺 / 装饰小字</div><div>样例：10 秒纯视觉，无配音或音乐</div></div></main>
<script>
const mode=new URLSearchParams(location.search).get('mode')||'specimen';
const canvas=document.getElementById('film'),ctx=canvas.getContext('2d');
let accent='#ff3d1f',time=0,playing=false,origin=0;
const ink='#0b0b0b',paper='#efede8';
const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>1-Math.pow(1-clamp(x),4);
const bayer=[0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21];
function text(s,x,y,size,color=paper){ctx.fillStyle=color;ctx.font=`700 ${size}px StyleSans,sans-serif`;ctx.textBaseline='top';ctx.fillText(s,x,y);}
function dots(x,y,w,h,luma,color,t){ctx.fillStyle=color;const cell=4;for(let yy=0;yy<h;yy+=cell){for(let xx=0;xx<w;xx+=cell){const density=clamp(luma+(xx/w-.5)*.25+Math.sin(yy/h*3+t)*.08);if((bayer[(yy/4%8)*8+(xx/4%8)]+.5)/64<density)ctx.fillRect(x+xx,y+yy,3,3);}}}
function people(t,light,phase){
 const fg=light?ink:paper,baseX=800,baseY=120;
 for(let i=0;i<30;i++){
  const col=i%5,row=Math.floor(i/5),selected=[2,12,24].includes(i);
  let x=baseX+col*72,y=baseY+row*72;
  if(phase===1&&!selected){y+=ease((t-3.4)/.65)*80;ctx.globalAlpha=1-ease((t-3.4)/.8)*.93;}
  if(phase===2&&!selected){ctx.globalAlpha=.07+ease((t-7.1)/.8)*.93;y+=40*(1-ease((t-7.1)/.8));}
  if(phase===0)y+=18*(1-ease((t-col*.04-row*.025)/.5));
  dots(x+16,y,24,20,selected?.9:.55,selected?accent:fg,t);
  dots(x+5,y+25,46,32,selected?.9:.65,selected?accent:fg,t);
  ctx.globalAlpha=1;
 }
}
function caption(s,light){ctx.font='700 30px StyleSans,sans-serif';ctx.textBaseline='top';const w=ctx.measureText(s).width;ctx.fillStyle=light?ink:paper;ctx.fillText(s,(1280-w)/2,642);}
function renderFrame(t){
 t=Math.max(0,Math.min(10,Number(t)));time=t;
 const phase=t<3.4?0:t<7?1:2,light=phase===1;
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle=light?paper:ink;ctx.fillRect(0,0,1280,720);
 if(mode==='transfer'){
  people(t,light,phase);
  const dt=t-(phase===0?0:phase===1?3.4:7),dx=phase===0?0:40*(1-ease(dt/.45));
  if(phase===0){text('你看见的',80,168,114);text('不是全部',80,310,114,accent);caption('看见的，只是留下来的那部分。',false);}
  if(phase===1){text('留下的',80+dx,164,126,ink);text('≠ 全部',80+dx,310,126,accent);caption('没有出现在眼前的，也影响着判断。',true);}
  if(phase===2){text('也要看见',80-dx,168,110);text('消失的',80-dx,310,140,accent);caption('把缺失的部分，也放回视野。',false);}
 }else{
  const fg=light?ink:paper;
  ctx.save();ctx.translate(1010,330);ctx.rotate(t*.15);dots(-170,-170,340,340,.6,fg,t);ctx.restore();
  const titles=[['巨型黑体','网点成形'],['黑白切换','单色信号'],['语义动作','稳定阅读']][phase];
  text(titles[0],80,165,118,fg);text(titles[1],80,315,118,accent);
  caption('用同一套视觉语言，解释不同的关系。',light);
 }
 // A single segmented wipe occurs on semantic transitions, not continuously.
 for(const start of [3.4,7]){const u=(t-start)/.42;if(u>0&&u<1){ctx.fillStyle=u<.5?(start===3.4?paper:ink):(start===3.4?ink:paper);for(let i=0;i<12;i++){const shift=clamp((u-i*.007)*2);const w=(shift<.5?shift*2:(1-shift)*2)*1280;ctx.fillRect(i%2?1280-w:0,i*60,w,60);}}}
 document.getElementById('seek').value=t;document.getElementById('time').value=t.toFixed(2)+'s';
 return {time:t,mode};
}
window.VIBE={renderFrame};window.renderFrame=renderFrame;
const font=new FontFace('StyleSans','url(assets/NotoSansSC-700.ttf)',{weight:'700'});
window.ready=font.load().then(f=>{document.fonts.add(f);renderFrame(0);return true;});
if(mode==='transfer'){document.querySelector('h1').textContent='迁移样例 · 看见的不是全部';document.getElementById('description').textContent='新主题、新主体与新构图；形体为关系示意，不代表真实统计。10 秒视觉机制验证，不是正式知识成片。';}
document.getElementById('color').oninput=e=>{accent=e.target.value;renderFrame(time);};
document.getElementById('seek').oninput=e=>{playing=false;document.getElementById('play').textContent='播放';renderFrame(e.target.value);};
document.getElementById('play').onclick=()=>{playing=!playing;if(playing){if(time>=10)time=0;origin=performance.now()-time*1000;}document.getElementById('play').textContent=playing?'暂停':'播放';};
function tick(now){if(playing){renderFrame((now-origin)/1000);if(time>=10){playing=false;document.getElementById('play').textContent='播放';}}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
