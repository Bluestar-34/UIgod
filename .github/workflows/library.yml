name: Library consistency
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python skills/uigod/tools/build_catalog.py
      - run: python skills/uigod/tools/build_gallery.py
      - run: python skills/uigod/tools/validate_library.py
      - run: python -m unittest discover -s skills/uigod/tests
      - run: git diff --exit-code -- catalog.json index.html
      - run: git diff --check
